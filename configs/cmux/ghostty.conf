font-family = MesloLGS NF
font-size = 15

# cmux sidebar rows scale with this (clamped 10-20)
sidebar-font-size = 15

bold-is-bright = true
cursor-style-blink = false
background-opacity = 1

# Shell integration otherwise forces a bar cursor at the prompt
cursor-style = block
shell-integration-features = no-cursor

# Ghostty defaults to gamma-correct blending, which renders noticeably thinner;
# native blending plus thickening matches macOS text weight
alpha-blending = native
font-thicken = true

# Left Option sends Esc+ for word-jump keybindings; right Option stays composed
macos-option-as-alt = left

window-padding-x = 8
window-padding-y = 6
window-padding-balance = true

mouse-hide-while-typing = true

# Ghostty defaults to copying on select
copy-on-select = false
